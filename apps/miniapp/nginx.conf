server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — the app uses hash routing, so all paths serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The page itself is never kept: after an update, Telegram loads the new
  # version instead of an old copy (the assets it names have new file names).
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
